<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forest Map Kit - HTML example</title>
<style>
  html, body { margin: 0; height: 100%; background: #17181d; color: #ddd; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud { position: fixed; left: 10px; top: 8px; background: #000a; padding: 6px 10px; border-radius: 4px; white-space: pre; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<script src="forest-map-runtime.js"></script>
<script>
'use strict';
// A whole world from the tool's "Export world (.zip)", unzipped next to this page as sample/ (world.json + cells/<A1>/map.json).
// The kit folder (tiles/, overlays/, objects/) is two levels up: this page lives in ForestMapKit/examples/html/.
// Serve the kit folder over http (python -m http.server, VS Code Live Server, ...): browsers do not fetch json from file://.
const WORLD = 'sample/world.json', KIT = '../../';
const kit = ForestMapKit;
const view = document.getElementById('view'), ctx = view.getContext('2d'), hud = document.getElementById('hud');
const ZOOM = 1;                              // 1 = native pixels (a person is 63 px tall); try 0.5 to see more of the map
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.length === 1 ? e.key.toLowerCase() : e.key); if (e.key === 'c') showCol = !showCol; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
let showCol = false;

// The actor: feet at (x, y), body radius r. draw() is called at the right depth by drawMap.
const hero = { x: 627, y: 627, r: 17, face: 0, speed: 260,
  draw(c) {
    c.save(); c.translate(this.x, this.y);
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, 0, this.r, this.r / 1.6, 0, 0, 7); c.fill();
    c.fillStyle = '#f2e6c8'; c.strokeStyle = '#3a2a18'; c.lineWidth = 3; c.beginPath(); c.ellipse(0, -30, 14, 30, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#c0392b'; c.beginPath(); c.moveTo(Math.cos(this.face) * 26, -30 + Math.sin(this.face) * 18);
    c.lineTo(Math.cos(this.face + 2.4) * 10, -30 + Math.sin(this.face + 2.4) * 10); c.lineTo(Math.cos(this.face - 2.4) * 10, -30 + Math.sin(this.face - 2.4) * 10); c.fill();
    c.restore();
  } };

(async () => {
  const world = await kit.loadWorld(WORLD, KIT);
  let cell = Object.keys(world.data.cells)[0], map = await world.cell(cell);
  [hero.x, hero.y] = kit.freeNear(map, map.size / 2, map.size / 2, hero.r);
  let last = performance.now(), busy = false;
  async function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let dx = 0, dy = 0;
    if (keys.has('ArrowLeft') || keys.has('a')) dx--; if (keys.has('ArrowRight') || keys.has('d')) dx++;
    if (keys.has('ArrowUp') || keys.has('w')) dy--; if (keys.has('ArrowDown') || keys.has('s')) dy++;
    if ((dx || dy) && !busy) {
      const len = Math.hypot(dx, dy);
      hero.face = Math.atan2(dy, dx);
      kit.move(map, hero, dx / len * hero.speed * dt, dy / len * hero.speed * dt);
      const t = await (busy = true, kit.travel(world, cell, hero)); busy = false;     // crossed an edge? then we are in the neighbour map now
      if (t) { cell = t.cell; map = t.map; }
    }
    // camera: the hero in the middle, clamped to the map
    view.width = Math.ceil(innerWidth / ZOOM); view.height = Math.ceil(innerHeight / ZOOM);
    const cam = { x: Math.max(0, Math.min(map.size - view.width, hero.x - view.width / 2)), y: Math.max(0, Math.min(map.size - view.height, hero.y - view.height / 2)) };
    if (view.width >= map.size) cam.x = (map.size - view.width) / 2;
    if (view.height >= map.size) cam.y = (map.size - view.height) / 2;
    ctx.fillStyle = '#0d0e11'; ctx.fillRect(0, 0, view.width, view.height);
    kit.drawMap(ctx, map, cam, [hero]);
    if (showCol) kit.drawCollision(ctx, map, cam);
    hud.textContent = `cell ${cell}  (${Math.round(hero.x)}, ${Math.round(hero.y)})\narrows / WASD walk, C = show collision\nwalk off an edge to enter the next map`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})().catch(e => { hud.textContent = 'Could not start: ' + e.message + '\nOpen this page over http (not file://) from inside the ForestMapKit folder.'; console.error(e); });
</script>
</body>
</html>
